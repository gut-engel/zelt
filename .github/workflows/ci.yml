# Tests on every push and pull request. No third-party actions: Flutter is
# cloned at a pinned tag and its commit is checked; first-party actions are
# pinned by commit.
name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
env:
  FLUTTER_TAG: 3.47.7
  FLUTTER_COMMIT: abaf9c523780a608bd46686fd5e53740a07077f8
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Flutter (pinned)
        run: |
          git clone -q --depth 1 -b "$FLUTTER_TAG" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_COMMIT"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --version && flutter pub get
      - name: Core (analyze, unit, end-to-end, latency, fuzz)
        working-directory: packages/zelt_core
        run: dart pub get && dart analyze --fatal-infos && dart test
      - name: App (analyze, widget tests)
        run: flutter analyze && flutter test
      - name: Relay installer (signature, update and rollback checks)
        run: bash scripts/test/install-relay-verify-test.sh
      - name: Linux installer (signature, checksum, downgrade, uninstall)
        run: bash scripts/test/install-linux-test.sh

  relay-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Flutter (pinned)
        run: |
          git clone -q --depth 1 -b "$FLUTTER_TAG" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_COMMIT"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Build and run the relay container as the installer does
        run: |
          docker build -q --build-arg "ZELT_REVISION=$GITHUB_SHA" -t zelt-relay:ci -f relay/Dockerfile . >/dev/null
          docker run -d --name zr --network host --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --memory 256m --pids-limit 100 \
            -e ZELT_PORT=47017 -e ZELT_PUBLIC_IP=127.0.0.1 -v zr-data:/data zelt-relay:ci
          for i in $(seq 30); do docker logs zr 2>&1 | grep -q 'zelt-relay:127' && break; sleep 1; done
          docker logs zr 2>&1 | grep -q -- '-----BEGIN ZELT RELAY QR-----' ||
            { docker ps -a --filter name=zr; docker logs zr 2>&1 | tail -n 60; exit 1; }
      - name: Relay answers with its identity and an onion key
        working-directory: packages/zelt_core
        run: |
          dart pub get
          dart run bin/zelt_check.dart "$(docker logs zr 2>&1 | grep -o 'zelt-relay:127[^ ]*' | head -n1)"
