# Builds the Windows release for a release tag. The maintainer's release
# script downloads this artifact, checks it was built from the tagged commit,
# and signs the update manifest locally; this workflow holds no signing keys.
name: windows
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
env:
  FLUTTER_TAG: 3.47.7
  FLUTTER_COMMIT: abaf9c523780a608bd46686fd5e53740a07077f8
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Flutter (pinned)
        shell: pwsh
        run: |
          git clone -q --depth 1 -b $env:FLUTTER_TAG https://github.com/flutter/flutter.git "$env:RUNNER_TEMP\flutter"
          if ((git -C "$env:RUNNER_TEMP\flutter" rev-parse HEAD) -ne $env:FLUTTER_COMMIT) { throw 'Flutter commit mismatch' }
          "$env:RUNNER_TEMP\flutter\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Build
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --release
      - name: Package
        shell: pwsh
        run: |
          $v = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+\s]+)').Matches[0].Groups[1].Value
          $zip = "zelt-$v-windows-x64.zip"
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath $zip
          "$env:GITHUB_SHA" | Out-File -Encoding ascii commit.txt
          (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower() + "  $zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x64
          path: |
            zelt-*-windows-x64.zip
            commit.txt
          if-no-files-found: error
          retention-days: 7
